apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

if (getGradle().getStartParameter().getTaskNames().toString().toLowerCase().contains("huawei")) {
    apply plugin: 'com.huawei.agconnect'
} else {
    apply plugin: 'com.google.gms.google-services'
}

def localProperties = new Properties()
try {
    localProperties.load(new FileInputStream(rootProject.file("local.properties")))
} catch (Exception ignored) {
    logger.warn("No Local Properties File Found!")
}
android {

    signingConfigs {

        debug {
            storeFile file('D:/Android/.dv.keystore/beep_591977')
            storePassword '591977'
            keyAlias 'dimonvideo'
            keyPassword '591977'
            v1SigningEnabled true
        }
    }

    defaultConfig {
        applicationId "com.dimonvideo.client"
        minSdkVersion 27
        targetSdkVersion 37
        versionCode 300000085
        versionName "5.0"

        buildConfigField("String", "BASE64_ENCODED_PUBLIC_KEY", "\"" + localProperties['base64EncodedPublicKey'] + "\"")

    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    buildFeatures {
        viewBinding true
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileSdkVersion = 37
    android.buildFeatures.buildConfig true
    flavorDimensions = ["dimonvideo"]

    productFlavors {
        DVClient_RuStore {
            dimension = 'dimonvideo'
            buildConfigField "boolean", "HUAWEI", "false"
            buildConfigField "boolean", "SAMSUNG", "false"
            buildConfigField "boolean", "NASHSTORE", "false"
            buildConfigField "boolean", "RUSTORE", "true"
            buildConfigField "boolean", "GOOGLE", "false"
            versionNameSuffix "-rustore"
        }

        DVClient_Huawei {
            dimension = 'dimonvideo'
            buildConfigField "boolean", "HUAWEI", "true"
            buildConfigField "boolean", "SAMSUNG", "false"
            buildConfigField "boolean", "NASHSTORE", "false"
            buildConfigField "boolean", "RUSTORE", "false"
            buildConfigField "boolean", "GOOGLE", "false"
            versionNameSuffix "-huawei"
        }

        DVClient_Google {
            dimension = 'dimonvideo'
            buildConfigField "boolean", "HUAWEI", "false"
            buildConfigField "boolean", "SAMSUNG", "false"
            buildConfigField "boolean", "NASHSTORE", "false"
            buildConfigField "boolean", "RUSTORE", "false"
            buildConfigField "boolean", "GOOGLE", "true"
            versionNameSuffix "-google"
        }
    }
    namespace 'com.dimonvideo.client'
    sourceSets {
        main {
            java.srcDirs += 'src/main/java'
        }
        DVClient_RuStore {
            java.srcDirs += 'src/DVClient_RuStore/java'
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
        DVClient_Google {
            java.srcDirs += 'src/DVClient_Google/java'
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
        DVClient_Huawei {
            manifest.srcFile 'src/DVClient_Huawei/AndroidManifest.xml'
            java.srcDirs += 'src/DVClient_Huawei/java'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.navigation:navigation-fragment:2.10.2'
    implementation 'androidx.navigation:navigation-ui:2.10.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation(platform('org.jetbrains.kotlin:kotlin-bom:2.3.20'))
    implementation 'androidx.activity:activity:1.13.0'

    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    implementation 'com.google.firebase:firebase-messaging:26.0.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.9'

    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-smoothstreaming:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.11.1'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

    // Room dependencies
    implementation 'androidx.room:room-runtime:2.8.5'
    annotationProcessor 'androidx.room:room-compiler:2.8.5'
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.work:work-testing:2.12.0'

    // Lifecycle components for better architecture
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'

    // Google
    // Импорт BoM для Firebase
    implementation platform('com.google.firebase:firebase-bom:35.0.0')
    DVClient_GoogleImplementation 'com.google.firebase:firebase-messaging'

    // RuStore
    DVClient_RuStoreImplementation 'com.google.firebase:firebase-messaging'

    // HUAWEI
    DVClient_HuaweiImplementation 'com.huawei.agconnect:agconnect-core:1.9.1.304'
    DVClient_HuaweiImplementation 'com.huawei.hms:hianalytics:6.12.0.301'
    DVClient_HuaweiImplementation 'com.huawei.hms:push:6.13.0.301'

    implementation('org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0')
}
